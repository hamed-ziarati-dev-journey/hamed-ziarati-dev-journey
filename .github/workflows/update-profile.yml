name: Refresh GitHub profile
on:
  push:
    paths:
      - profile.json
      - scripts/render_readme.py
      - .github/workflows/update-profile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Regenerate README and SVG panels
        run: python3 scripts/render_readme.py
      - name: Commit generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/about.svg assets/tech-stack.svg assets/nameplate.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile content"
            git push
          fi
